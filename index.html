<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Daily</title>
    <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg:        #fdf6f6;
            --card:      #ffffff;
            --accent:    #ff6b6b;
            --text:      #2c2c2c;
            --red:       #e74c3c;
            --red-light: #ffe0e0;
            --green:     #28a745;
            --gray:      #7f8c8d;

            --radius:    20px;
            --shadow-sm: 0 4px 16px rgba(231,76,60,0.10);
            --shadow-md: 0 10px 32px rgba(231,76,60,0.18);
            --spacing:   clamp(1rem, 4vw, 2.5rem);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            font-size: 100%;
            scroll-behavior: smooth;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.5;
        }

        header {
            padding: clamp(12px, 3vw, 16px) clamp(12px, 4vw, 20px);
            background: linear-gradient(135deg, #ffeef4, #fff5e6);
            font-family: 'Permanent Marker', cursive;
            font-size: clamp(1.8rem, 6vw, 2.4rem);
            text-align: center;
            color: var(--red);
            text-shadow: 2px 2px 0 #fff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
            z-index: 10;
        }

        .header-title {
            flex: 1;
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        .header-btn {
            background: none;
            border: none;
            font-size: clamp(1.3rem, 4vw, 1.6rem);
            color: var(--red);
            width: 44px;
            height: 44px;
            border-radius: 12px;
            cursor: pointer;
            display: grid;
            place-items: center;
            transition: all 0.2s;
            touch-action: manipulation;
        }

        .header-btn:hover,
        .header-btn:focus-visible {
            background: rgba(231,76,60,0.12);
            transform: scale(1.08);
        }

        /* ─── LOGIN ──────────────────────────────────────────────── */
        .login-screen {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999;
        }

        .login-form {
            background: white;
            padding: clamp(24px, 6vw, 36px) clamp(20px, 5vw, 28px);
            border-radius: 24px;
            width: min(92%, 400px);
            text-align: center;
        }

        .login-form h2 {
            font-family: 'Permanent Marker', cursive;
            color: var(--red);
            font-size: clamp(2.2rem, 7vw, 2.8rem);
            margin-bottom: 1rem;
        }

        .login-form input {
            width: 100%;
            padding: 14px 16px;
            font-size: 1.2rem;
            border: 2px solid var(--red-light);
            border-radius: 14px;
            margin: 12px 0;
        }

        .login-form button {
            width: 100%;
            padding: 16px;
            font-size: 1.4rem;
            font-weight: bold;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.22s;
        }

        .login-form button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(255,107,107,0.4);
        }

        /* ─── MAIN LAYOUT ────────────────────────────────────────── */
        .main {
            display: none;
            height: 100vh;
        }

        .content {
            display: flex;
            height: 100%;
        }

        .sidebar {
            width: 80px;
            background: white;
            border-right: 1px solid var(--red-light);
            padding: 12px 6px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .tasks-area {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .date-title {
            font-size: clamp(1.3rem, 5vw, 1.6rem);
            font-weight: 700;
            text-align: center;
            padding: 16px 20px 12px;
            background: white;
            border-bottom: 1px solid var(--red-light);
            color: var(--text);
        }

        .task-carousel {
            flex: 1;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scroll-behavior: smooth;
            overscroll-behavior: contain;
            padding: 60px 0 220px;
            scroll-padding: 80px 0 160px;
        }

        .task-list {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: clamp(40px, 12vw, 80px);
            padding: 0 12px;
        }

        .task {
            background: var(--card);
            border-radius: 24px;
            padding: 20px 24px;
            width: min(94%, 420px);
            box-shadow: var(--shadow-sm);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            position: relative;
            scroll-snap-align: center;
            transition: all 0.42s cubic-bezier(0.34, 1.56, 0.64, 1);
            min-height: 110px;
        }

        .task.active {
            transform: scale(1.08) translateY(-12px);
            box-shadow: var(--shadow-md);
            z-index: 5;
        }

        .task:not(.active) {
            transform: scale(0.86);
            opacity: 0.68;
            filter: blur(0.5px);
        }

        @media (prefers-reduced-motion: reduce) {
            .task, .task.active, .task:not(.active) {
                transition: none !important;
                transform: none !important;
                filter: none !important;
            }
        }

        .delete-btn {
            position: absolute;
            top: 12px;
            right: 16px;
            background: none;
            border: none;
            font-size: 1.9rem;
            color: var(--red);
            cursor: pointer;
            opacity: 0.7;
            transition: all 0.2s;
        }

        .delete-btn:hover {
            opacity: 1;
            transform: scale(1.2);
        }

        .task-text {
            flex: 1;
            font-size: clamp(1.1rem, 4.8vw, 1.38rem);
            font-weight: 500;
            line-height: 1.48;
            text-align: left;
            word-break: break-word;
            hyphens: auto;
            padding-right: 50px;
            cursor: text;
            outline: none;
        }

        .task-text.long       { font-size: clamp(1.05rem, 4.5vw, 1.28rem); }
        .task-text.very-long  { font-size: clamp(0.98rem, 4.2vw, 1.18rem); }

        .task-status {
            font-size: 2.6rem;
            width: 54px;
            height: 54px;
            display: grid;
            place-items: center;
            flex-shrink: 0;
        }

        .add-btn {
            position: fixed;
            bottom: 32px;
            right: 32px;
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: var(--accent);
            color: white;
            font-size: 2.8rem;
            border: none;
            box-shadow: 0 12px 32px rgba(255,107,107,0.4);
            z-index: 100;
            cursor: pointer;
            display: none;
            transition: all 0.22s;
        }

        .add-btn:hover {
            transform: scale(1.08) translateY(-4px);
        }

        /* ─── DATE BUTTONS ───────────────────────────────────────── */
        .date-btn {
            padding: 10px 6px;
            text-align: center;
            cursor: pointer;
            border-radius: 12px;
            font-size: 0.78rem;
            line-height: 1.3;
            margin: 4px 0;
            transition: all 0.2s;
            position: relative;
        }

        .date-btn.status-empty    { color: var(--gray); }
        .date-btn.status-completed { background: #d4edda; color: #155724; font-weight: 600; }
        .date-btn.status-incomplete{ background: #f8d7da; color: #721c24; font-weight: 600; }
        .date-btn.active::before  { content:''; position:absolute; left:0; top:0; bottom:0; width:5px; background:var(--red); border-radius:0 4px 4px 0; }
        .date-btn.today::after    { content:''; position:absolute; bottom:4px; left:50%; transform:translateX(-50%); width:5px; height:5px; background:var(--accent); border-radius:50%; }

        /* ─── GOALS MODAL ────────────────────────────────────────── */
        .goals-modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.65);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            display: none;
        }

        .goals-content {
            background: white;
            border-radius: 28px;
            width: min(94%, 520px);
            max-height: 88vh;
            overflow-y: auto;
            padding: clamp(24px, 5vw, 32px);
        }

        .goals-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 2px solid var(--red-light);
        }

        .goals-title {
            font-family: 'Permanent Marker', cursive;
            color: var(--red);
            font-size: clamp(2rem, 6vw, 2.4rem);
        }

        .close-goals {
            background: none;
            border: none;
            font-size: 2.6rem;
            color: var(--red);
            cursor: pointer;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            transition: all 0.2s;
        }

        .close-goals:hover {
            background: var(--red-light);
            transform: rotate(90deg);
        }

        .goal-item {
            background: #fdf6f6;
            border-radius: 20px;
            padding: 16px 56px 16px 60px;
            margin-bottom: 16px;
            box-shadow: 0 3px 16px rgba(0,0,0,0.06);
            position: relative;
            transition: all 0.25s;
        }

        .goal-item.completed {
            background: #e8f5e9;
            border-left: 5px solid var(--green);
        }

        .goal-item:hover {
            transform: translateX(6px);
            box-shadow: 0 8px 28px rgba(231,76,60,0.15);
        }

        .goal-checkbox {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            width: 26px;
            height: 26px;
            accent-color: var(--green);
        }

        .goal-text {
            font-size: clamp(1.12rem, 4.2vw, 1.32rem);
            line-height: 1.5;
            cursor: text;
            outline: none;
            min-height: 26px;
        }

        .goal-text.completed {
            text-decoration: line-through;
            color: var(--green);
            opacity: 0.85;
        }

        .goal-delete {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            font-size: 1.9rem;
            color: var(--red);
            cursor: pointer;
            opacity: 0.75;
            transition: all 0.2s;
        }

        .goal-delete:hover {
            opacity: 1;
            transform: translateY(-50%) scale(1.18);
        }

        .add-goal-btn {
            width: 100%;
            padding: 16px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 16px;
            font-size: 1.35rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.22s;
        }

        .add-goal-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 28px rgba(255,107,107,0.35);
        }

        .empty {
            text-align: center;
            color: #aaa;
            font-size: 1.2rem;
            padding: 80px 24px;
        }

        /* ─── RESPONSIVE ─────────────────────────────────────────── */
        @media (min-width: 640px) {
            .sidebar { width: 100px; padding: 16px 8px; }
            .date-btn { font-size: 0.9rem; padding: 12px 8px; margin: 6px 0; }
            .task { width: min(88%, 480px); padding: 24px 28px; }
            .task.active { transform: scale(1.06) translateY(-10px); }
        }

        @media (min-width: 900px) {
            .content { max-width: 1200px; margin: 0 auto; }
            .sidebar { width: 160px; }
            .date-btn { font-size: 1.05rem; padding: 14px 10px; }
            .task-list { max-width: 560px; margin: 0 auto; }
            .task-carousel { padding: 80px 0 240px; }
        }

        @media (min-width: 1200px) {
            .task { max-width: 600px; padding: 28px 32px; }
        }
    </style>
</head>
<body>

<div class="login-screen" id="loginScreen">
    <div class="login-form">
        <h2>My Daily</h2>
        <p style="margin: 1rem 0 1.5rem; color:#555;">Введите номер телефона</p>
        <input type="tel" id="phoneInput" placeholder="+376 (__) ___-__-__" autocomplete="tel">

</div>
